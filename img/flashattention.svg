<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" preserveAspectRatio="xMidYMid slice" role="img" aria-label="flash attention — softmax(QKᵀ) heatmap">
  <defs>
    <!-- viridis-ish ramp: deep purple → blue → teal → green → yellow -->
    <linearGradient id="attn-ramp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1f1240"/>
      <stop offset="25%" stop-color="#2a3a8c"/>
      <stop offset="50%" stop-color="#1c8ce8"/>
      <stop offset="72%" stop-color="#3bb273"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cb-ramp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#1f1240"/>
      <stop offset="25%" stop-color="#2a3a8c"/>
      <stop offset="50%" stop-color="#1c8ce8"/>
      <stop offset="72%" stop-color="#3bb273"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="tri">
      <polygon points="12,5 12,49 56,49"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="80" height="60" fill="#0a0a0a"/>

  <!-- plot frame -->
  <rect x="12" y="5" width="44" height="44" fill="#0f0f12"/>

  <!-- attention heatmap (lower triangular causal mask) -->
  <rect x="12" y="5" width="44" height="44" fill="url(#attn-ramp)" clip-path="url(#tri)"/>

  <!-- subtle row scanlines giving the matrix a discrete feel -->
  <g stroke="rgba(0,0,0,0.18)" stroke-width="0.18" clip-path="url(#tri)">
    <line x1="12" y1="9"  x2="56" y2="9"/>
    <line x1="12" y1="13" x2="56" y2="13"/>
    <line x1="12" y1="17" x2="56" y2="17"/>
    <line x1="12" y1="21" x2="56" y2="21"/>
    <line x1="12" y1="25" x2="56" y2="25"/>
    <line x1="12" y1="29" x2="56" y2="29"/>
    <line x1="12" y1="33" x2="56" y2="33"/>
    <line x1="12" y1="37" x2="56" y2="37"/>
    <line x1="12" y1="41" x2="56" y2="41"/>
    <line x1="12" y1="45" x2="56" y2="45"/>
    <line x1="16" y1="5" x2="16" y2="49"/>
    <line x1="20" y1="5" x2="20" y2="49"/>
    <line x1="24" y1="5" x2="24" y2="49"/>
    <line x1="28" y1="5" x2="28" y2="49"/>
    <line x1="32" y1="5" x2="32" y2="49"/>
    <line x1="36" y1="5" x2="36" y2="49"/>
    <line x1="40" y1="5" x2="40" y2="49"/>
    <line x1="44" y1="5" x2="44" y2="49"/>
    <line x1="48" y1="5" x2="48" y2="49"/>
    <line x1="52" y1="5" x2="52" y2="49"/>
  </g>

  <!-- a single block-tile being computed (the flash-attn idea) -->
  <rect x="36" y="29" width="12" height="12" fill="none" stroke="#ffe16b" stroke-width="0.7" opacity="0.9"/>
  <rect x="36" y="29" width="12" height="12" fill="#ffe16b" opacity="0.08"/>

  <!-- plot frame outline -->
  <rect x="12" y="5" width="44" height="44" fill="none" stroke="#3a3a3a" stroke-width="0.4"/>

  <!-- colorbar -->
  <rect x="61" y="5" width="3.5" height="44" fill="url(#cb-ramp)"/>
  <rect x="61" y="5" width="3.5" height="44" fill="none" stroke="#3a3a3a" stroke-width="0.3"/>

  <!-- axis ticks -->
  <g stroke="#666" stroke-width="0.25">
    <line x1="12" y1="49" x2="12" y2="50.5"/>
    <line x1="34" y1="49" x2="34" y2="50.5"/>
    <line x1="56" y1="49" x2="56" y2="50.5"/>
    <line x1="10.5" y1="5"  x2="12" y2="5"/>
    <line x1="10.5" y1="27" x2="12" y2="27"/>
    <line x1="10.5" y1="49" x2="12" y2="49"/>
  </g>

  <!-- small "K" label on x and "Q" on y, using dot+letter glyphs -->
  <g fill="#9aa0a6" font-family="ui-monospace, monospace" font-size="3.5">
    <text x="33" y="55">K</text>
    <text x="6"  y="29">Q</text>
  </g>
</svg>
